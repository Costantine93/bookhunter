name: BookHunter Python Check

on:
  push:
    branches:
      - gemini-integration
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Controlla la sintassi Python
        run: |
          python -m py_compile main.py
          python -m py_compile book_catalog.py
          python -m py_compile gemini_librarian.py

      - name: Esegue i test automatici
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -v
